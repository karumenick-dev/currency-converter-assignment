<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker with Live Currency Conversion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Expense Tracker</h1>
      <p>Track your spending with live currency conversion</p>
    </header>

    <div class="controls-bar">
      <div class="control-group">
        <label for="homeCurrency">Home Currency:</label>
        <select id="homeCurrency">
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="KES">KES</option>
        </select>
      </div>
      <div class="control-group">
        <label for="categoryFilter">Filter Category:</label>
        <select id="categoryFilter">
          <option value="ALL">All Categories</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Shopping">Shopping</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>

    <section id="statusMessage" class="hidden"></section>

    <div class="dashboard-grid">
      <form id="expenseForm" class="card">
        <h2>Add Expense</h2>
        <div class="form-control">
          <label for="description">Description</label>
          <input type="text" id="description" required placeholder="e.g., Lunch, Uber">
        </div>
        <div class="form-control">
          <label for="amount">Amount</label>
          <input type="number" id="amount" step="0.01" required placeholder="0.00">
        </div>
        <div class="form-control">
          <label for="currency">Currency Paid</label>
          <select id="currency">
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="KES">KES</option>
          </select>
        </div>
        <div class="form-control">
          <label for="category">Category</label>
          <select id="category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Add Expense</button>
      </form>

      <div class="card summary-card">
        <h2>Summary</h2>
        <div class="total-display">
          <span>Total Spending:</span>
          <h3 id="runningTotal">0.00</h3>
        </div>
        <div id="expenseList" class="expense-list">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
