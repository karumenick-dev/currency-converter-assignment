<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker with Live Currency Conversion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Personal Expense Tracker</h1>
    <p>Track your spending with live currency conversions</p>
  </header>

  <main class="container">
    <section id="form-card" class="card">
      <h2 id="form-title">Add Expense</h2>
      <form id="ExpenseForm" class="ExpenseForm">
        <div class="form-control">
          <label for="description">Description</label>
          <input type="text" id="description" required placeholder="e.g., Lunch, Uber">
        </div>
        <div class="form-control">
          <label for="amount">Amount</label>
          <input type="number" id="amount" step="0.01" required placeholder="0.00">
        </div>
        <div class="form-control">
          <label for="currency">Currency Paid</label>
          <div class="select-with-flag">
            <img id="currency-flag" class="flag" src="" alt="">
            <select id="currency"></select>
          </div>
        </div>
        <div class="form-control">
          <label for="category">Category</label>
          <select id="category"></select>
        </div>
        <div class="form-buttons">
          <button type="submit" id="submit-button" class="btn btn-primary">Add expense</button>
          <button type="button" id="cancel-button" class="btn btn-plain" hidden>Cancel</button>
        </div>
      </form>
      <p id="form-error" class="form-error" role="alert"></p>
    </section>
    <section class="controls-bar">
      <div class="control-group">
        <label for="home-currency">Home Currency</label>
        <div class="select-with-flag">
          <img id="home-flag" class="flag" src="" alt="">
          <select id="home-currency"></select>
        </div>
      </div>
      <div class="controls-bar">
        <label for="category-filter">Filter category</label>
        <select id="category-filter"></select>
      </div>
    </section>
    <section class="card">
      <h2>Your Expenses</h2>
      <ul id="expense-list" class="expense-list"></ul>
      <p id="empty-message" class="empty-message">No expenses yet. Add one above.</p>
      <div class="total">
        <span class="total-label">Total spent</span>
        <span id="total-amount" class="total-amount">0.00</span>
      </div>
    </section>
  </main>
  <script src="src/main.js"></script>
</body>
</html>
